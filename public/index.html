<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Target Goals Reports · Arena Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050505;
  --panel:#0c0e0c;
  --panel-2:#111411;
  --line:#1d221d;
  --green:#39FF14;
  --green-dim:#1f7a12;
  --text:#e8ece8;
  --muted:#e8ece8;
  --red:#ff4d4d;
  --amber:#ffb020;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
body{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:13px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1500px;margin:0 auto;padding:22px 26px 80px}

/* ---------- header ---------- */
header{display:flex;align-items:flex-start;gap:18px}
.logo{width:74px;height:auto;flex:0 0 auto;margin-top:2px}
.titleblock h1{font-family:Inter,system-ui,sans-serif;font-size:38px;font-weight:800;letter-spacing:-.5px;margin:0;line-height:1}
.titleblock h1 span{color:var(--green)}
.sub{margin-top:8px;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.meta{margin-left:auto;color:var(--muted);font-size:12px;text-align:right;padding-top:6px}
.meta b{color:var(--text);font-weight:500}

/* ---------- tabs + actions ---------- */
button.btn{background:transparent;border:1px solid var(--line);color:var(--text);font:inherit;letter-spacing:1.2px;padding:9px 14px;cursor:pointer}
button.btn:hover{border-color:var(--green);color:var(--green)}
button.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* ---------- filters ---------- */
.filters{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-top:26px;padding:16px;border:1px solid var(--line);background:var(--panel)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{color:var(--muted);font-size:11px;letter-spacing:1.2px}
select,input[type=text],input[type=number]{background:var(--panel-2);border:1px solid var(--line);color:var(--text);font:inherit;padding:9px 10px;min-width:130px}
select:hover,input:hover{border-color:var(--green-dim)}
.spacer{flex:1}

/* ---------- summary ---------- */

/* ---------- table ---------- */
.panel{margin-top:18px;border:1px solid var(--line);background:var(--panel)}
.panel .head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel .head .t{letter-spacing:1.6px}
.panel .head .h{color:var(--muted);font-size:11px;letter-spacing:1.2px}
table{width:100%;border-collapse:collapse}
th{color:var(--muted);font-weight:400;font-size:11px;letter-spacing:1.3px;text-align:right;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel-2);white-space:nowrap;cursor:pointer;user-select:none}
th:first-child{text-align:left}
th.sorted{color:var(--green)}
td{padding:12px 16px;text-align:right;border-bottom:1px solid #131813;font-variant-numeric:tabular-nums}
td:first-child{text-align:left;color:var(--text)}
tbody tr:hover td{background:#0f130f}
tr.group td{background:#0f150f;color:var(--green);letter-spacing:1.8px;font-size:11px;border-bottom:1px solid var(--line);border-top:1px solid var(--line);padding:10px 16px}
tr.group td:last-child{color:var(--text);letter-spacing:1.2px}
tr.group:hover td{background:#0f150f}
span.adj{color:var(--green)}
td input.numedit{width:120px;text-align:right;padding:6px 9px;background:#0a0d0a;border:1px solid var(--line);color:var(--green);font:inherit;font-variant-numeric:tabular-nums}
td input.numedit::placeholder{color:var(--green-dim);letter-spacing:.5px}
td input.numedit:hover{border-color:var(--green-dim)}
td input.numedit:focus{border-color:var(--green);outline:none}
td input.numedit::-webkit-outer-spin-button,td input.numedit::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
td input.numedit{-moz-appearance:textfield;appearance:textfield}
tr.gap td{height:26px;border-bottom:0;padding:0;background:var(--bg)}
tr.gap:hover td{background:var(--bg)}
td.metric{letter-spacing:.4px}
.pill{display:inline-block;padding:3px 9px;border:1px solid currentColor;font-size:11px;letter-spacing:1px}
.ok{color:var(--green)}
.warn{color:var(--amber)}
.bad{color:var(--red)}
.dim{color:var(--text)}
.banner{display:none;margin-top:18px;border:1px solid var(--red);background:#160b0b;color:var(--red);padding:14px 16px;line-height:1.7}
.banner.show{display:block}
.banner b{display:block;letter-spacing:1.4px;margin-bottom:6px}
.banner code{color:var(--green)}
.banner button{margin-top:10px;background:transparent;border:1px solid var(--red);color:var(--red);font:inherit;letter-spacing:1.2px;padding:7px 12px;cursor:pointer}
.banner button:hover{border-color:var(--green);color:var(--green)}
.empty{padding:60px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);margin-bottom:8px;letter-spacing:1px}

footer{margin-top:34px;color:var(--muted);font-size:11px;letter-spacing:1px}
@media (max-width:720px){
  .titleblock h1{font-size:26px}
  .logo{width:54px}
  .meta{display:none}
  .wrap{padding:16px}
}
</style>
</head>

  <div class="empty" id="empty" style="display:none"><b>No metrics for this period</b>Change the month or year filter, or load a report.</div>
</div>

<footer>ARENA CLUB · INTERNAL OPS TOOL</footer>
</div>

<script>
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const nf=n=>n===null||n===undefined||isNaN(n)?'—':Math.round(n).toLocaleString();
const pf=n=>(n===null||!isFinite(n))?'—':(n*100).toFixed(1)+'%';

const now=new Date();
let state={
  month:now.getMonth()+1,
  year:now.getFullYear(),
  search:'',
  source:'loading…',
  sort:{key:'metric',dir:1},
  rows:[]
};

/* ---------- filters ---------- */
const selM=document.getElementById('fMonth'), selY=document.getElementById('fYear');
MONTHS.forEach((m,i)=>{const o=document.createElement('option');o.value=i+1;o.textContent=m;selM.appendChild(o)});
for(let y=now.getFullYear()+1;y>=now.getFullYear()-3;y--){const o=document.createElement('option');o.value=y;o.textContent=y;selY.appendChild(o)}
selM.value=state.month; selY.value=state.year;
selM.onchange=()=>{state.month=+selM.value;loadFromMetabase()};
selY.onchange=()=>{state.year=+selY.value;loadFromMetabase()};
document.getElementById('fSearch').oninput=e=>{state.search=e.target.value.trim().toLowerCase();render()};

/* ---------- data model ---------- */
function computed(r){
  const elapsed=r.elapsed_biz_days||0;
  const base=r.current_total||0;
  const promo=r.promo||0;
  const total=base+promo;
  const baseAvg=r.daily_avg!=null?r.daily_avg:(elapsed?base/elapsed:0);
  const avg=promo?(elapsed?total/elapsed:baseAvg):baseAvg;
  return {...r,base_total:base,current_total:total,daily_avg:avg,promo:r.promo??null};
}
function visible(){
  let rows=state.rows.filter(r=>r.month===state.month&&r.year===state.year);
  if(state.search) rows=rows.filter(r=>r.metric.toLowerCase().includes(state.search));
  rows=rows.map(computed);
  const k=state.sort.key,d=state.sort.dir;
  rows.sort((a,b)=>{
    if(k==='metric') return (orderIn(a.metric)-orderIn(b.metric))*d || a.metric.localeCompare(b.metric)*d;
    const av=a[k],bv=b[k];
    return ((av==null?-Infinity:av)-(bv==null?-Infinity:bv))*d;
  });
  return rows;
}

/* ---------- groups ---------- */
const GROUPS=[
  {name:'INTAKE',metrics:['customers','customers_raw','slab_packs','slab_packs_raw','total_cards']},
  {name:'PIPELINE',metrics:['process','scan','vault','ship']}
];
const groupOf=m=>{
  const key=String(m).toLowerCase();
  const g=GROUPS.find(g=>g.metrics.includes(key));
  return g?g.name:'OTHER';
};
const orderIn=m=>{
  const key=String(m).toLowerCase();
  for(const g of GROUPS){const i=g.metrics.indexOf(key); if(i>-1) return i}
  return 999;
};

/* ---------- columns ---------- */
const COLUMNS=[
  {k:'metric',t:'METRIC'},
  {k:'current_total',t:'CURRENT_TOTAL',f:r=>r.promo?`<span class="adj" title="base ${nf(r.base_total)} + promo ${nf(r.promo)}">${nf(r.current_total)}</span>`:nf(r.current_total)},
  {k:'elapsed_biz_days',t:'ELAPSED_BIZ_DAYS',f:r=>nf(r.elapsed_biz_days)},
  {k:'daily_avg',t:'DAILY_AVG',f:r=>nf(r.daily_avg)},
  {k:'promo',t:'PROMO',input:true,ph:'add promo'}
];
const cols=()=>COLUMNS;

/* ---------- render ---------- */
function render(){
  const rows=visible();
  document.getElementById('mCount').textContent=rows.length;
  document.getElementById('mSource').textContent=state.source;
  document.getElementById('panelTitle').textContent=
    MONTHS[state.month-1].toUpperCase()+' '+state.year;

  // head
  document.getElementById('thead').innerHTML='<tr>'+cols().map(c=>
    `<th data-k="${c.k}" class="${state.sort.key===c.k?'sorted':''}">${c.t}${state.sort.key===c.k?(state.sort.dir===1?' ▲':' ▼'):''}</th>`).join('')+'</tr>';
  document.querySelectorAll('#thead th').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    state.sort = state.sort.key===k?{key:k,dir:-state.sort.dir}:{key:k,dir:k==='metric'?1:-1};
    render();
  });

  // body — grouped with a spacer band between sections
  const tb=document.getElementById('tbody');
  const order=[...GROUPS.map(g=>g.name),'OTHER'];
  let html='';
  order.forEach(name=>{
    const set=rows.filter(r=>groupOf(r.metric)===name);
    if(!set.length) return;
    html+=`<tr class="group"><td>${name}</td><td colspan="${cols().length-1}">${set.length} metrics</td></tr>`;
    html+=set.map(r=>'<tr>'+cols().map(c=>{
      if(c.k==='metric') return `<td class="metric">${r.metric}</td>`;
      if(c.input) return `<td><input class="numedit" type="number" inputmode="numeric" data-metric="${r.metric}" data-field="${c.k}" value="${r[c.k]==null?'':r[c.k]}" placeholder="${c.ph}"></td>`;
      return `<td>${c.f(r)}</td>`;
    }).join('')+'</tr>').join('');
    html+=`<tr class="gap"><td colspan="${cols().length}"></td></tr>`;
  });
  tb.innerHTML=html;

  tb.querySelectorAll('input.numedit').forEach(inp=>{
    inp.onchange=e=>{
      const m=e.target.dataset.metric, f=e.target.dataset.field;
      const v=e.target.value===''?null:+e.target.value;
      state.rows.forEach(r=>{
        if(r.metric===m&&r.month===state.month&&r.year===state.year) r[f]=(v==null||isNaN(v))?null:v;
      });
      render();
    };
    inp.onkeydown=e=>{if(e.key==='Enter')e.target.blur()};
  });

  document.getElementById('empty').style.display=rows.length?'none':'block';
  document.getElementById('tbl').style.display=rows.length?'table':'none';
}

/* ---------- loading ---------- */
const QUESTION_ID=30328;

function normalize(raw){
  return raw.map(src=>{
    const o={};
    Object.keys(src||{}).forEach(k=>o[String(k).toLowerCase().trim().replace(/\s+/g,'_')]=src[k]);
    const num=v=>{if(v===undefined||v===null||v==='')return null;const n=+String(v).replace(/[, $%]/g,'');return isNaN(n)?null:n};
    const metric=o.metric||o.name;
    if(!metric) return null;
    const elapsed=num(o.elapsed_biz_days)??num(o.elapsed_business_days)??0;
    const total=num(o.current_total)??num(o.total)??0;
    return {
      metric:String(metric),
      current_total:total,
      elapsed_biz_days:elapsed,
      daily_avg:num(o.daily_avg)??(elapsed?total/elapsed:0),
      promo:num(o.promo)??num(o.promo_add)??null,
      report_month:o.report_month?String(o.report_month):null,
      month:num(o.month)??state.month,
      year:num(o.year)??state.year
    };
  }).filter(Boolean);
}
function loadRows(rows,source){
  state.rows=JSON.parse(JSON.stringify(rows)); state.source=source; render();
}

/* pulls question 30328 through /api/metabase */
let fetchToken=0;
function banner(msg){
  const b=document.getElementById('banner');
  if(!msg){b.classList.remove('show');b.innerHTML='';return}
  b.innerHTML=`<b>Could not load question ${QUESTION_ID}</b>${msg}<br><button id="btnRetry">RETRY</button>`;
  b.classList.add('show');
  document.getElementById('btnRetry').onclick=loadFromMetabase;
}
async function loadFromMetabase(){
  const token=++fetchToken;
  banner('');
  state.source='loading question '+QUESTION_ID+'…';
  document.getElementById('mSource').textContent=state.source;
  try{
    const res=await fetch(`/api/metabase?id=${QUESTION_ID}&month=${state.month}&year=${state.year}`);
    const ct=res.headers.get('content-type')||'';
    if(!ct.includes('json')){
      throw new Error('The <code>/api/metabase</code> route did not respond with JSON. If you opened this file directly, or deployed without the <code>api/</code> folder, there is no server function to call.');
    }
    const body=await res.json();
    if(token!==fetchToken) return;
    if(!res.ok) throw new Error(String(body.error||('server returned '+res.status)));
    const raw=Array.isArray(body)?body:(body.rows||body.data||[]);
    if(body&&body.warning) banner(String(body.warning));
    if(!raw.length) throw new Error('The question ran but returned zero rows.');
    const rows=normalize(raw);
    if(!rows.length){
      throw new Error('The question returned '+raw.length+' rows, but none had a metric column. Columns received: <code>'+Object.keys(raw[0]).join(', ')+'</code>');
    }
    loadRows(rows,'question '+QUESTION_ID);
    const want=`${state.year}-${String(state.month).padStart(2,'0')}`;
    const got=rows.find(r=>r.report_month)?.report_month;
    if(got&&!String(got).startsWith(want)){
      banner(`The question returned <code>${got}</code>, not <code>${want}</code> — the filter values did not bind. Open <code>/api/metabase?id=${QUESTION_ID}&month=${state.month}&year=${state.year}&debug=1</code> to see the template tags the card declares and the parameters being sent.`);
    }
  }catch(e){
    if(token!==fetchToken) return;
    state.rows=[]; state.source='no data'; render();
    banner(e.message||'Request failed.');
  }
}

document.getElementById('btnCsv').onclick=()=>{
  const rows=visible(); if(!rows.length) return;
  const head=cols().map(c=>c.t);
  const line=r=>cols().map(c=>{
    if(c.k==='metric')return r.metric;
    if(c.input)return r[c.k]==null?'':r[c.k];
    if(c.k==='current_total')return r.current_total;
    const v=c.f(r); return v==='—'?'':v.replace(/,/g,'');
  }).join(',');
  const csv=[head.join(','),...rows.map(line)].join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=`target-goals-${state.year}-${String(state.month).padStart(2,'0')}.csv`;
  a.click();
};

loadFromMetabase();
</script>
</body>
</html>
